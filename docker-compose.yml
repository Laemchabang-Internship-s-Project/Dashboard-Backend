# ============================================
# LCBH Dashboard - Docker Compose
# ============================================
# วิธีใช้:
#   เริ่มระบบ:    docker compose up -d
#   ดู logs:      docker compose logs -f
#   หยุดระบบ:     docker compose down
#   รีบิลด์:      docker compose up -d --build
# ============================================

services:
  # ------------------------------------------
  # Redis: ตัวกลางเก็บ Cache + Pub/Sub
  # ------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: lcbh-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ------------------------------------------
  # Dashboard API: FastAPI Application
  # ------------------------------------------
  dashboard-api:
    build: .
    container_name: lcbh-dashboard-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override REDIS_HOST ให้ชี้ไปที่ container redis (ไม่ใช่ localhost)
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - TZ=Asia/Bangkok
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis_data:
