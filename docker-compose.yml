version: "3.9"

services:
  redis:
    image: redis:7-alpine
    container_name: lcbh-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - lcbh_network
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  dashboard-api:
    build: .
    container_name: lcbh-dashboard-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"

    env_file:
      - .env

    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      TZ: Asia/Bangkok
      PYTHONUNBUFFERED: 1

    depends_on:
      redis:
        condition: service_healthy
      db-analytics:
        condition: service_healthy  # รอจน Postgres พร้อมรับ connection จริงๆ

    networks:
      - lcbh_network

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  
  db-analytics:
    image: postgres:15-alpine
    container_name: lcbh-postgres
    ports:
      - "5432:5432"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${PG_DB}
      - POSTGRES_USER=${PG_USER}
      - POSTGRES_PASSWORD=${PG_PASSWORD}
      - TZ=Asia/Bangkok
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    networks:
      - lcbh_network
    # ตรวจสอบว่า Postgres พร้อมรับ connection จริงๆ ก่อน dashboard-api จะ start
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_DB}"]
      interval: 5s    # ตรวจทุก 5 วิ
      timeout: 5s     # timeout ต่อครั้ง
      retries: 10     # ลองสูงสุด 10 ครั้ง (~50 วิ)
      start_period: 10s  # รอ 10 วิ ก่อนเริ่มตรวจ (Postgres init ช้า)
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

networks:
  lcbh_network:
    driver: bridge

volumes:
  redis_data: