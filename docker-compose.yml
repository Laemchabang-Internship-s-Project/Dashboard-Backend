version: "3.9"

services:
  redis:
    image: redis:7-alpine
    container_name: lcbh-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - lcbh_network
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  dashboard-api:
    build: .
    container_name: lcbh-dashboard-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"

    env_file:
      - .env

    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      TZ: Asia/Bangkok
      PYTHONUNBUFFERED: 1

    depends_on:
      redis:
        condition: service_healthy

    networks:
      - lcbh_network

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  

networks:
  lcbh_network:
    driver: bridge

volumes:
  redis_data: